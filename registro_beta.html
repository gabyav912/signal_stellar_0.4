<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEÑAL-STELLAR - Registro</title>
    <link rel="icon" type="image/png" href="logo_signal_stellar.png">
    <style>
        :root {
            --fondo-base: #000000;
            --tarjeta-bg: #161616;
            --tarjeta-borde: #222222;
            --verde-boton: #28a745;
            --verde-hover: #218838;
            --dorado-titulo: #d4af37;
            --texto-blanco: #ffffff;
            --texto-gris: #cccccc;
            --pantalla-input: #0c0c0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: serif, Times, "Times New Roman", Arial;
        }

        body {
            background-color: var(--fondo-base);
            color: var(--texto-blanco);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
        }

        /* --- CABECERA SUPERIOR --- */
        header.cabecera-principal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .marca h1 {
            color: var(--dorado-titulo);
            font-size: 32px;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .marca p {
            color: var(--texto-blanco);
            font-size: 16px;
            margin-top: 4px;
            font-family: sans-serif;
        }

        /* --- PANEL PRINCIPAL CENTRADO --- */
        main.contenido-principal {
            background-color: var(--tarjeta-bg);
            border: 1px solid var(--tarjeta-borde);
            border-radius: 8px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .seccion-titulo {
            color: var(--dorado-titulo);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* --- FORMULARIO Y CAMPOS --- */
        fieldset {
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
        }

        legend {
            color: var(--dorado-titulo);
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            padding: 0 8px;
            text-transform: uppercase;
        }

        .grupo-campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
            font-family: sans-serif;
        }

        .grupo-campo:last-child {
            margin-bottom: 0;
        }

        label {
            color: var(--texto-gris);
            font-size: 14px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--pantalla-input);
            border: 1px solid #333333;
            border-radius: 6px;
            color: var(--texto-blanco);
            font-size: 15px;
            font-family: sans-serif;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--dorado-titulo);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .campo-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: sans-serif;
            font-size: 14px;
            color: var(--texto-gris);
        }

        .campo-checkbox input {
            width: 18px;
            height: 18px;
            accent-color: var(--verde-boton);
            cursor: pointer;
        }

        .campo-checkbox a {
            color: var(--verde-boton);
            text-decoration: underline;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .panel-acciones {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-accion {
            padding: 10px 24px;
            border-radius: 6px;
            border: none;
            font-family: sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-accion:hover {
            opacity: 0.9;
        }

        .btn-guardar {
            background-color: var(--verde-boton);
            color: var(--texto-blanco);
        }

        .btn-cancelar {
            background-color: #dc3545;
            color: var(--texto-blanco);
        }
    </style>
</head>
<body>

    <!-- Cabecera Superior -->
    <header class="cabecera-principal">
        <div class="marca">
            <h1>SEÑAL-STELLAR</h1>
            <p>Registro de usuario</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="contenido-principal">
        <h2 class="seccion-titulo" id="titulo-form">Formulario de registro</h2>

        <form id="form-registro" onsubmit="guardarRegistro(event)">
            
            <!-- Datos de Acceso -->
            <fieldset>
                <legend>Datos de acceso</legend>
                
                <div class="grupo-campo">
                    <label for="nombre">Usuario:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: pato" required>
                </div>

                <div class="grupo-campo">
                    <label for="nombre_completo">Nombre real:</label>
                    <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Ej: Gabriel AV" required>
                </div>

                <div class="grupo-campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="6" placeholder="******" required>
                </div>
            </fieldset>

            <!-- Ubicación y Descripción -->
            <fieldset>
                <legend>Perfil estelar</legend>

                <div class="grupo-campo">
                    <label for="pais">País:</label>
                    <select id="pais" name="pais" required>
                        <option value="" disabled selected>Selecciona tu país...</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Bolivia">Bolivia</option>
                        <option value="Chile">Chile</option>
                        <option value="Colombia">Colombia</option>
                        <option value="Ecuador">Ecuador</option>
                        <option value="España">España</option>
                        <option value="México">México</option>
                        <option value="Perú">Perú</option>
                        <option value="Uruguay">Uruguay</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="descripcion">Descripción tuya / Metas:</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Escribe tus objetivos de estudio o enfoque personal..."></textarea>
                </div>
            </fieldset>

            <!-- Términos -->
            <fieldset>
                <legend>Condiciones</legend>
                
                <div class="campo-checkbox">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los <a href="soporte.html" target="_blank">Términos del servicio</a> de Señal-Stellar.</label>
                </div>
            </fieldset>

            <!-- Acciones -->
            <section class="panel-acciones">
                <button type="button" class="btn-accion btn-cancelar" onclick="cancelarRegistro()">Cancelar</button>
                <button type="submit" class="btn-accion btn-guardar">Guardar Registro</button>
            </section>

        </form>
    </main>

    <script>
        // Cargar datos al iniciar la página si ya existen en localStorage
        document.addEventListener("DOMContentLoaded", () => {
            const perfilGuardado = localStorage.getItem("usuarioStellarPerfil");
            if (perfilGuardado) {
                try {
                    const usuario = JSON.parse(perfilGuardado);
                    document.getElementById("nombre").value = usuario.usuario || "";
                    document.getElementById("nombre_completo").value = usuario.nombre || "";
                    document.getElementById("correo").value = usuario.correo || "";
                    document.getElementById("password").value = usuario.password || "";
                    document.getElementById("pais").value = usuario.pais || "";
                    document.getElementById("descripcion").value = usuario.descripcion || "";
                    document.getElementById("terminos").checked = true;
                    
                    document.getElementById("titulo-form").textContent = "Editar Perfil de Usuario";
                } catch (e) {
                    console.error("Error al parsear el perfil guardado", e);
                }
            }
        });

        function guardarRegistro(event) {
            event.preventDefault();

            const usuario = {
                usuario: document.getElementById("nombre").value.trim(),
                nombre: document.getElementById("nombre_completo").value.trim(),
                correo: document.getElementById("correo").value.trim(),
                password: document.getElementById("password").value,
                pais: document.getElementById("pais").value,
                descripcion: document.getElementById("descripcion").value.trim()
            };

            // Guarda el perfil completo
            localStorage.setItem("usuarioStellarPerfil", JSON.stringify(usuario));
            
            // Marca la sesión como activa para usar en main.html o login.html
            localStorage.setItem("usuarioStellarSesion", JSON.stringify({
                activo: true,
                usuario: usuario.usuario,
                nombre: usuario.nombre
            }));

            alert("Perfil guardado correctamente.");
            window.location.href = "dashboard_beta.html";
        }

        function cancelarRegistro() {
            if (confirm("¿Cancelar registro y volver a la página principal?")) {
                window.location.href = "dashboard_beta.html";
            }
        }
    </script>
</body>
</html>
